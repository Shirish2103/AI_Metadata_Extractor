version: "3.8"

services:
  api:
    build: .
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./archive:/app/archives
    environment:
      - PYTHONUNBUFFERED=1
      # The raw dataset lives beside the project and is available in Docker.
      # Override DATASET_ROOT only when deliberately using another dataset.
      - DATASET_ROOT=${DATASET_ROOT:-/app/archives}
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app/api
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./requirements.txt
